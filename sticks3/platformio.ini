[platformio]
default_envs = sticks3

[env:sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_upload.after_reset = watchdog_reset
board_build.flash_size = 8MB
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 115200
extra_scripts = post:scripts/platformio_tools.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified@0.2.27
    m5stack/M5GFX@0.2.34
    bblanchon/ArduinoJson@7.4.3

[env:diagnostic]
extends = env:sticks3
build_flags = ${env:sticks3.build_flags} -DSTICKS3_DIAGNOSTIC
